[project]
name = "skill-first-ai"
version = "1.0.0"
description = "Fewer agents, more reusable capabilities. A skill-first reference implementation for Microsoft Foundry."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ricardo Cataldi", email = "ricardo@cataldi.com.br" }]
keywords = [
    "ai-agents",
    "microsoft-foundry",
    "azure-ai-foundry",
    "mcp",
    "skill-first",
    "enterprise-architecture",
]

dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Cataldir/skill-first-ai"
Talk = "https://github.com/Cataldir/skill-first-ai/tree/main/presentation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_first_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
