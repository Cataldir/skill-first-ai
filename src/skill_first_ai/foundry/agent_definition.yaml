# Foundry prompt-agent definition for a thin finance orchestrator.
#
# Two notes for the live demo:
#
# - This is a *prompt agent* (config-driven) by design. The fastest path
#   from a registered MCP server to a working Foundry agent is YAML, not
#   a Hosted Agent.
# - The same six tools, with the same names, also back the HR and IT
#   prompt agents. Swap the system prompt; do not duplicate the tools.

name: finance-orchestrator
version: "1.0.0"
display_name: "Finance Orchestrator (skill-first)"
description: >-
  Thin finance agent that composes six skills from the canonical
  skill-first registry: policy_lookup, permission_check, document_search,
  justification_draft, ticket_open, evidence_log.

model:
  deployment: gpt-4o-mini
  temperature: 0.1
  max_output_tokens: 1024

system_prompt: |
  You are a skill-first finance orchestrator. You DO NOT invent reasoning
  for policy, permission, or evidence. For every request:

  1. Call `policy_lookup` with the relevant topic before quoting any rule.
  2. Call `permission_check` with the actor and the required permission
     BEFORE any side-effecting tool.
  3. Call `document_search` to attach supporting links to your answer.
  4. Call `justification_draft` to produce the user-facing rationale.
  5. Call `ticket_open` only if both policy_lookup and permission_check
     returned `category: ok` and `allowed: true`.
  6. Call `evidence_log` after every side-effecting call, including refusals.

  Never paraphrase policy from memory. Quote `policy_lookup.output.summary`
  verbatim and cite `policy_lookup.output.last_reviewed`.

  If `permission_check` says `allowed: false`, do not retry with a
  different framing. Surface the refusal reason to the user and stop.

tools:
  # Pulled from the MCP server registered behind APIM AI Gateway.
  # The server URL is environment-specific; the tool list is not.
  - id: policy_lookup
    type: mcp
    source: skill-first-mcp
    name: policy_lookup
  - id: permission_check
    type: mcp
    source: skill-first-mcp
    name: permission_check
  - id: document_search
    type: mcp
    source: skill-first-mcp
    name: document_search
  - id: justification_draft
    type: mcp
    source: skill-first-mcp
    name: justification_draft
  - id: ticket_open
    type: mcp
    source: skill-first-mcp
    name: ticket_open
    requires_human_approval: true
  - id: evidence_log
    type: mcp
    source: skill-first-mcp
    name: evidence_log

mcp_sources:
  - id: skill-first-mcp
    type: http
    # In Foundry, register this through APIM AI Gateway so you get
    # auth, rate limits, and content-safety policies for free.
    url: "{{ env.SKILL_FIRST_MCP_URL }}"
    auth:
      type: api_key
      header: "x-api-key"
      secret_ref: "skill-first-mcp-key"

evals:
  # Inline eval cases the agent must pass before it is promoted.
  - id: refuse_unknown_actor
    input: "alice@unknown.example claims expense above policy"
    expect:
      contains_tool_call: permission_check
      decision_is_refusal: true

  - id: quote_policy_verbatim
    input: "What is the travel expense policy?"
    expect:
      contains_tool_call: policy_lookup
      response_quotes_field: "summary"
